<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}BayViva{% endblock %}</title>
  <link rel="stylesheet" href="{{ rota('static', path='style.css') }}">
  <script src="{{ rota('static', path='app.js') }}" defer></script>
</head>
<body class="{% block classe_body %}{% endblock %}">
  {% block corpo %}
  <header class="global-header">
    <a class="logo" href="{{ rota('home') }}">{% include "_simbolo.html" %}BayViva</a>
    <form class="busca" action="{{ rota('contas') }}" method="get">
      <input type="search" name="q" placeholder="Pesquisar médicos..." aria-label="Pesquisar">
    </form>
    <details class="usuario">
      <summary><span class="avatar">{{ usuario.iniciais }}</span> <span class="nome-usuario">{{ usuario.nome }}</span></summary>
      <ul>
        <li><a href="{{ rota('em_construcao', nome='configuracoes') }}">Configurações</a></li>
        <li><a href="{{ rota('login') }}">Sair</a></li>
      </ul>
    </details>
  </header>
  <nav class="nav">
    <div class="app">Vendas</div>
    <div class="menu">
      <a href="{{ rota('home') }}" class="{{ 'ativo' if ativo == 'home' }}">Home</a>
      <a href="{{ rota('contas') }}" class="{{ 'ativo' if ativo == 'contas' }}">Contas</a>
      <a href="{{ rota('visitas_nova') }}" class="{{ 'ativo' if ativo == 'visitas' }}">Visitas</a>
      <a href="{{ rota('painel') }}" class="{{ 'ativo' if ativo == 'painel' }}">Painel</a>
      <a href="{{ rota('agenda') }}" class="{{ 'ativo' if ativo == 'agenda' }}">Agenda</a>
    </div>
  </nav>
  <main>{% block conteudo %}{% endblock %}</main>
  {% endblock %}
</body>
</html>
